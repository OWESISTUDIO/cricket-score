<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="theme-color" content="#0a1a33">
<title>Cricket Scorer</title>
<style>
  :root { --navy:#0a1a33; --navy2:#12294f; --gold:#ffc21a; --red:#e3262f; --green:#17a34a; --blue:#1f6fe0; --purple:#7a5bd6; --bg:#eef2f8; --card:#fff; --text:#0f1b2d; --muted:#5d6b82; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; background: var(--bg); color: var(--text); }
  header { background: var(--navy); color: #fff; padding: 10px 14px; display: flex; align-items: center; gap: 10px; position: sticky; top: 0; z-index: 5; }
  header h1 { font-size: 17px; margin: 0; flex: 1; }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: #888; display: inline-block; }
  .dot.ok { background: #2ee66b; } .dot.bad { background: var(--red); }
  .hbtn { background: rgba(255,255,255,.12); color: #fff; border: 0; border-radius: 8px; padding: 7px 10px; font-size: 13px; }
  main { padding: 12px; max-width: 560px; margin: 0 auto; }
  .card { background: var(--card); border-radius: 14px; padding: 14px; margin-bottom: 12px; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
  h2 { font-size: 15px; margin: 0 0 10px; }
  label { display: block; font-size: 13px; color: var(--muted); margin: 10px 0 4px; }
  input, select { width: 100%; font-size: 17px; padding: 11px 12px; border: 1.5px solid #cdd6e4; border-radius: 10px; background: #fff; color: var(--text); }
  input:focus { outline: none; border-color: var(--blue); }
  .row { display: flex; gap: 10px; } .row > * { flex: 1; min-width: 0; }
  .btn { display: block; width: 100%; border: 0; border-radius: 12px; padding: 14px; font-size: 17px; font-weight: 700; background: var(--navy); color: #fff; margin-top: 12px; }
  .btn.gold { background: var(--gold); color: var(--navy); }
  .btn.light { background: #dfe6f1; color: var(--text); }
  .btn.red { background: var(--red); }
  .seg2 { display: flex; gap: 8px; } .seg2 button { flex: 1; padding: 12px; border-radius: 10px; border: 1.5px solid #cdd6e4; background: #fff; font-size: 15px; font-weight: 600; color: var(--text); }
  .seg2 button.on { background: var(--navy); color: #fff; border-color: var(--navy); }

  .sb { background: var(--navy); color: #fff; border-radius: 14px; padding: 12px 14px; margin-bottom: 12px; }
  .sb .t { font-size: 13px; color: #b7c4dc; text-transform: uppercase; }
  .sb .s { font-size: 34px; font-weight: 800; line-height: 1.1; }
  .sb .s small { font-size: 16px; font-weight: 600; color: var(--gold); margin-left: 8px; }
  .sb .info { font-size: 14px; color: var(--gold); margin-top: 2px; }
  .ppl { display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; margin-top: 8px; font-size: 15px; }
  .ppl .on { font-weight: 700; } .ppl .on::before { content: "\25B6 "; color: var(--gold); font-size: 11px; }
  .ppl .dim { color: #b7c4dc; }
  .ovr { display: flex; gap: 5px; flex-wrap: wrap; margin-top: 8px; }
  .ovr span { min-width: 28px; height: 28px; border-radius: 14px; background: rgba(255,255,255,.15); display: inline-flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; padding: 0 6px; }
  .ovr .w { background: var(--red); } .ovr .b4 { background: var(--blue); } .ovr .b6 { background: var(--green); } .ovr .x { background: var(--purple); }

  .pad { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .pad button { border: 0; border-radius: 12px; font-size: 22px; font-weight: 800; padding: 16px 0; background: #fff; color: var(--text); box-shadow: 0 1px 3px rgba(0,0,0,.12); }
  .pad button:active { transform: scale(.96); }
  .pad .b4 { background: var(--blue); color: #fff; } .pad .b6 { background: var(--green); color: #fff; }
  .pad .w { background: var(--red); color: #fff; grid-column: span 2; }
  .pad .x { background: #ece7fb; color: var(--purple); font-size: 17px; }
  .pad .x.on { background: var(--purple); color: #fff; }
  .pad .u { background: #dfe6f1; font-size: 17px; }
  .mode { text-align: center; font-size: 14px; color: var(--purple); font-weight: 700; min-height: 20px; margin: 6px 0 2px; }
  .tools { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 10px; }
  .tools button { border: 0; border-radius: 10px; padding: 11px 6px; background: #dfe6f1; font-size: 14px; font-weight: 600; color: var(--text); }
  .link { word-break: break-all; font-size: 13px; background: #f3f6fb; padding: 10px; border-radius: 8px; border: 1px dashed #b9c5d8; }
  .preview { width: 100%; aspect-ratio: 16/9; border: 0; border-radius: 10px; background: #2f5d23; display: block; margin-top: 10px; }
  .note { font-size: 13px; color: var(--muted); margin-top: 8px; line-height: 1.45; }

  .modal { position: fixed; inset: 0; background: rgba(5,12,25,.6); display: none; align-items: flex-end; justify-content: center; z-index: 20; }
  .modal.on { display: flex; }
  .sheet { background: #fff; width: 100%; max-width: 560px; border-radius: 18px 18px 0 0; padding: 16px 16px 22px; max-height: 88vh; overflow: auto; }
  .sheet h3 { margin: 0 0 10px; font-size: 18px; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 6px 0 4px; }
  .chips button { border: 1.5px solid #cdd6e4; background: #fff; border-radius: 999px; padding: 10px 14px; font-size: 15px; font-weight: 600; color: var(--text); }
  .chips button.on { background: var(--navy); color: #fff; border-color: var(--navy); }
  .hide { display: none !important; }
</style>
</head>
<body>
<header>
  <h1>Cricket Scorer</h1>
  <span class="dot" id="dot" title="Live sync"></span>
  <button class="hbtn" id="menuBtn">Settings</button>
</header>
<main id="app"></main>

<div class="modal" id="modal"><div class="sheet" id="sheet"></div></div>

<script src="mqtt.min.js"></script>
<script src="sync.js"></script>
<script>
/* ---------- state ---------- */
const KEY = "cricscore.v1";
const HKEY = "cricscore.hist.v1";
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s == null ? "" : s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

function load(k, d) { try { const v = JSON.parse(localStorage.getItem(k)); return v == null ? d : v; } catch (e) { return d; } }
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(S)); localStorage.setItem(HKEY, JSON.stringify(H.slice(-150))); } catch (e) {}
}
function newCode() { return Math.random().toString(36).slice(2, 8) + Math.random().toString(36).slice(2, 6); }

let S = load(KEY, null);
let H = load(HKEY, []);
if (!S) S = fresh();
function fresh(keep) {
  return { code: (keep && keep.code) || newCode(), t1: (keep && keep.t1) || "", t2: (keep && keep.t2) || "", overs: (keep && keep.overs) || 20, wl: (keep && keep.wl) || 10,
    stage: "setup", cur: 0, inn: [], msg: "", live: true, fxId: 0, fx: null };
}
function I() { return S.inn[S.cur]; }
function snap() { H.push(JSON.stringify(S)); if (H.length > 200) H.shift(); }

/* ---------- sync ---------- */
const st = [false, false];
const pub = CricSync.publisher(S.code, (i, ok) => { st[i] = ok; const d = $("dot"); d.className = "dot " + (st[0] || st[1] ? "ok" : "bad"); });
function oversTxt(b) { return Math.floor(b / 6) + (b % 6 ? "." + (b % 6) : ""); }
function oversFull(b) { return Math.floor(b / 6) + "." + (b % 6); }
function rate(r, b) { return b ? (r * 6 / b).toFixed(2) : "0.00"; }
function target() { return S.inn[0] ? S.inn[0].runs + 1 : 0; }

function view() {
  const v = { seq: Date.now(), live: S.live, msg: S.msg || "" };
  let cur = S.cur, i = I();
  if (!i && S.inn[0]) { cur = 0; i = S.inn[0]; } // innings break: keep the 1st innings up
  if (!i) { v.bt = S.t1 || "Team 1"; v.bw = S.t2 || "Team 2"; v.r = 0; v.w = 0; v.o = "0.0"; v.ovl = S.overs; v.ps = []; v.crr = "0.00"; v.inn = 1; v.info = "Match jald shuru hoga"; return v; }
  v.inn = cur + 1; v.bt = i.bat; v.bw = i.bowl; v.r = i.runs; v.w = i.wk; v.o = oversFull(i.balls); v.ovl = S.overs;
  const p = [];
  [i.st, i.ns].forEach((x) => { if (x != null && i.bats[x]) p.push({ n: i.bats[x].n, r: i.bats[x].r, b: i.bats[x].b, on: x === i.st }); });
  v.ps = p;
  const b = i.bwl[i.cb];
  if (b) v.bo = { n: b.n, f: b.w + "-" + b.r, o: oversTxt(b.b) };
  v.ob = i.over.length ? i.over : (i.last || []);
  v.ol = i.over.length || !i.last ? "This over" : "Last over";
  v.crr = rate(i.runs, i.balls);
  if (cur === 1) {
    const t = target(), need = t - i.runs, left = S.overs * 6 - i.balls;
    v.tgt = t; v.rrr = left > 0 && need > 0 ? (need * 6 / left).toFixed(2) : "-";
    if (!S.result) v.info = need > 0 ? i.bat + " need " + need + " run" + (need === 1 ? "" : "s") + " from " + left + " ball" + (left === 1 ? "" : "s") : "";
  } else {
    if (i.balls >= 6 && i.balls < S.overs * 6) v.proj = Math.round(i.runs + (i.runs / i.balls) * (S.overs * 6 - i.balls));
    if (i.end) v.info = i.bat + " " + i.runs + "/" + i.wk + " · " + i.bowl + " need " + (i.runs + 1) + " to win";
  }
  if (i.fh && !S.result) v.info = "FREE HIT" + (v.info ? " · " + v.info : "");
  if (S.result) v.res = S.result;
  if (S.fx) v.fx = S.fx;
  return v;
}
function push() { save(); pub.publish(view()); }

/* ---------- modal helper ---------- */
function sheet(html, onReady) { $("sheet").innerHTML = html; $("modal").classList.add("on"); if (onReady) onReady(); }
function closeSheet() { $("modal").classList.remove("on"); }

// Ask for a name: typed, or tapped from a list of earlier names.
function askName(title, opts) {
  opts = opts || {};
  return new Promise((resolve) => {
    const chips = (opts.choices || []).map((n, k) => '<button data-k="' + k + '">' + esc(n) + "</button>").join("");
    sheet('<h3>' + esc(title) + '</h3>' + (chips ? '<div class="note">Pehle wala chunein:</div><div class="chips" id="ch">' + chips + "</div><label>Ya naya naam</label>" : "") +
      '<input id="nm" placeholder="Naam likhein" autocomplete="off">' +
      '<button class="btn gold" id="ok">Theek hai</button>' + (opts.cancel ? '<button class="btn light" id="cx">Wapas</button>' : ""), () => {
      const nm = $("nm");
      if (!chips) setTimeout(() => nm.focus(), 50);
      const done = (val) => { closeSheet(); resolve(val); };
      if ($("ch")) $("ch").onclick = (e) => { const k = e.target.getAttribute("data-k"); if (k != null) done(opts.choices[+k]); };
      $("ok").onclick = () => { const v = nm.value.trim(); if (!v) { nm.focus(); nm.style.borderColor = "#e3262f"; return; } done(v); };
      nm.onkeydown = (e) => { if (e.key === "Enter") $("ok").click(); };
      if ($("cx")) $("cx").onclick = () => done(null);
    });
  });
}
function askChoice(title, choices, cancel) {
  return new Promise((resolve) => {
    sheet('<h3>' + esc(title) + '</h3><div class="chips" id="ch">' + choices.map((c, k) => '<button data-k="' + k + '">' + esc(c) + "</button>").join("") + "</div>" +
      (cancel ? '<button class="btn light" id="cx">Wapas</button>' : ""), () => {
      $("ch").onclick = (e) => { const k = e.target.getAttribute("data-k"); if (k != null) { closeSheet(); resolve(+k); } };
      if ($("cx")) $("cx").onclick = () => { closeSheet(); resolve(null); };
    });
  });
}

/* ---------- screens ---------- */
function render() {
  if (S.stage === "setup") return renderSetup();
  if (S.stage === "openers") return renderOpeners();
  return renderPlay();
}

function renderSetup() {
  $("app").innerHTML =
    '<div class="card"><h2>Naya match</h2>' +
    '<label>Team 1 ka naam</label><input id="t1" value="' + esc(S.t1) + '" placeholder="Maslan: Lions XI">' +
    '<label>Team 2 ka naam</label><input id="t2" value="' + esc(S.t2) + '" placeholder="Maslan: Tigers XI">' +
    '<div class="row"><div><label>Kitne over</label><input id="ov" inputmode="numeric" value="' + S.overs + '"></div>' +
    '<div><label>Kitni wickets (all out)</label><input id="wl" inputmode="numeric" value="' + S.wl + '"></div></div>' +
    '<label>Pehle batting kaun karega?</label><div class="seg2"><button id="bf1" class="on">Team 1</button><button id="bf2">Team 2</button></div>' +
    '<button class="btn gold" id="go">Aage</button></div>' + linkCard();
  let first = 1;
  $("bf1").onclick = () => { first = 1; $("bf1").className = "on"; $("bf2").className = ""; };
  $("bf2").onclick = () => { first = 2; $("bf2").className = "on"; $("bf1").className = ""; };
  $("t1").oninput = $("t2").oninput = () => { S.t1 = $("t1").value; S.t2 = $("t2").value; push(); };
  $("go").onclick = () => {
    const t1 = $("t1").value.trim(), t2 = $("t2").value.trim();
    const ov = parseInt($("ov").value, 10), wl = parseInt($("wl").value, 10);
    if (!t1 || !t2) return alert("Dono teams ke naam likhein.");
    if (!(ov > 0 && ov <= 100)) return alert("Over sahi likhein (1 se 100).");
    if (!(wl > 0 && wl <= 20)) return alert("Wickets sahi likhein (maslan 10).");
    S.t1 = t1; S.t2 = t2; S.overs = ov; S.wl = wl;
    S.first = first; S.stage = "openers"; S.cur = 0; S.inn = []; S.result = ""; H = [];
    push(); render();
  };
  wireLink();
}

function renderOpeners() {
  const batT = battingTeam(S.cur), bowlT = bowlingTeam(S.cur);
  $("app").innerHTML =
    '<div class="card"><h2>' + (S.cur === 0 ? "1st" : "2nd") + " inning: " + esc(batT) + " batting</h2>" +
    (S.cur === 1 ? '<div class="note">Target: <b>' + target() + "</b> runs</div>" : "") +
    '<label>Striker (pehli ball khelega)</label><input id="a" placeholder="Batsman ka naam">' +
    '<label>Non-striker</label><input id="b" placeholder="Batsman ka naam">' +
    '<label>Bowler (' + esc(bowlT) + ')</label><input id="c" placeholder="Bowler ka naam">' +
    '<button class="btn gold" id="go">Match shuru</button>' +
    (S.cur === 0 ? '<button class="btn light" id="back">Wapas</button>' : "") + "</div>" + linkCard();
  $("go").onclick = () => {
    const a = $("a").value.trim(), b = $("b").value.trim(), c = $("c").value.trim();
    if (!a || !b || !c) return alert("Teeno naam likhein.");
    snap();
    S.inn[S.cur] = { bat: batT, bowl: bowlT, runs: 0, wk: 0, balls: 0, ext: 0,
      bats: [newBat(a), newBat(b)], st: 0, ns: 1, bwl: [{ n: c, b: 0, r: 0, w: 0 }], cb: 0, over: [], last: null, fh: false, end: false };
    S.stage = "play"; S.fx = null;
    push(); render();
  };
  if ($("back")) $("back").onclick = () => { S.stage = "setup"; push(); render(); };
  wireLink();
}
function battingTeam(n) { const f = S.first === 2 ? S.t2 : S.t1, s = S.first === 2 ? S.t1 : S.t2; return n === 0 ? f : s; }
function bowlingTeam(n) { return battingTeam(n === 0 ? 1 : 0); }
function newBat(n) { return { n: n, r: 0, b: 0, f: 0, s: 0, out: "" }; }

let mode = null; // "nb" | "b" | "lb" | "wd": the next run button is an extra
let nbBye = false; // on a no ball: the runs were byes, not off the bat

function renderPlay() {
  const i = I();
  const v = view();
  const ballCls = (l) => l.startsWith("W") && !l.startsWith("Wd") ? "w" : l === "4" ? "b4" : l === "6" ? "b6" : /^(Wd|Nb|\d+b|\d+lb)/.test(l) ? "x" : "";
  const ppl = [i.st, i.ns].map((x) => i.bats[x]).filter(Boolean).map((p, k) =>
    '<div class="' + (k === 0 ? "on" : "") + '">' + esc(p.n) + '</div><div>' + p.r + ' <span class="dim">(' + p.b + ")</span></div>").join("");
  const bw = i.bwl[i.cb];
  const ended = i.end;
  $("app").innerHTML =
    '<div class="sb"><div class="t">' + esc(i.bat) + " vs " + esc(i.bowl) + " · " + (S.cur + 1) + (S.cur ? "nd" : "st") + ' inning</div>' +
    '<div class="s">' + i.runs + "-" + i.wk + "<small>" + oversFull(i.balls) + " / " + S.overs + " ov</small></div>" +
    '<div class="info">' + esc(S.result || v.info || ("Run rate " + v.crr)) + "</div>" +
    '<div class="ppl">' + ppl + (bw ? '<div class="dim">Bowler: ' + esc(bw.n) + '</div><div class="dim">' + bw.w + "-" + bw.r + " (" + oversTxt(bw.b) + ")</div>" : "") + "</div>" +
    '<div class="ovr">' + (i.over.length ? i.over : []).map((l) => '<span class="' + ballCls(l) + '">' + esc(l) + "</span>").join("") + "</div></div>" +
    (ended ? endCard() :
    '<div class="card"><div class="pad">' +
      [0, 1, 2, 3].map((n) => '<button data-r="' + n + '">' + n + "</button>").join("") +
      '<button data-r="4" class="b4">4</button><button data-r="6" class="b6">6</button>' +
      '<button data-r="5">5</button><button class="u" id="undo">Undo</button>' +
      '<button class="x' + (mode === "wd" ? " on" : "") + '" data-m="wd">Wide</button><button class="x' + (mode === "nb" ? " on" : "") + '" data-m="nb">No ball</button>' +
      '<button class="x' + (mode === "b" ? " on" : "") + '" data-m="b">Bye</button><button class="x' + (mode === "lb" ? " on" : "") + '" data-m="lb">Leg bye</button>' +
      '<button class="w" id="wkt">WICKET</button><button class="u" id="swap">Strike badlein</button><button class="u" id="chb">Bowler badlein</button>' +
    '</div><div class="mode">' + modeText() + "</div>" +
    (mode === "nb" ? '<div class="seg2" style="margin-bottom:6px"><button id="nbBat" class="' + (nbBye ? "" : "on") + '">Bat se laga</button><button id="nbBye" class="' + (nbBye ? "on" : "") + '">Bat se nahi (bye)</button></div>' : "") +
    '<div class="tools"><button id="msg">Screen par message</button><button id="ren">Naam theek karein</button></div></div>') +
    linkCard();

  document.querySelectorAll("[data-r]").forEach((b) => b.onclick = () => runs(+b.getAttribute("data-r")));
  document.querySelectorAll("[data-m]").forEach((b) => b.onclick = () => { const m = b.getAttribute("data-m"); mode = mode === m ? null : m; nbBye = false; render(); });
  if ($("nbBat")) $("nbBat").onclick = () => { nbBye = false; render(); };
  if ($("nbBye")) $("nbBye").onclick = () => { nbBye = true; render(); };
  if ($("undo")) $("undo").onclick = undo;
  if ($("wkt")) $("wkt").onclick = wicket;
  if ($("swap")) $("swap").onclick = () => { snap(); const t = i.st; i.st = i.ns; i.ns = t; push(); render(); };
  if ($("chb")) $("chb").onclick = () => changeBowler(true);
  if ($("msg")) $("msg").onclick = setMsg;
  if ($("ren")) $("ren").onclick = renameSomeone;
  if ($("next")) $("next").onclick = () => { snap(); S.cur = 1; S.stage = "openers"; S.fx = null; push(); render(); };
  if ($("undo2")) $("undo2").onclick = undo;
  if ($("newm")) $("newm").onclick = newMatch;
  wireLink();
}
function modeText() {
  return mode === "wd" ? "WIDE: ab runs dabayein (sirf wide = 0)" : mode === "nb" ? "NO BALL: bat se kitne runs? (0 agar koi nahi)" :
    mode === "b" ? "BYE: kitne runs?" : mode === "lb" ? "LEG BYE: kitne runs?" : "";
}
function endCard() {
  if (S.cur === 0) return '<div class="card"><h2>1st inning khatam</h2><div class="note">' + esc(I().bat) + " ne " + I().runs + "/" + I().wk + " banaye. Target: <b>" + target() + "</b></div>" +
    '<button class="btn gold" id="next">2nd inning shuru karein</button><button class="btn light" id="undo2">Undo (aakhri ball)</button></div>';
  return '<div class="card"><h2>Match khatam</h2><div class="note"><b>' + esc(S.result) + "</b></div>" +
    '<button class="btn light" id="undo2">Undo (aakhri ball)</button><button class="btn red" id="newm">Naya match</button></div>';
}

/* ---------- scoring ---------- */
function fx(k) { S.fxId = (S.fxId || 0) + 1; S.fx = { k: k, id: S.fxId }; }
function swap(i) { if (i.ns == null) return; const t = i.st; i.st = i.ns; i.ns = t; }

function runs(n) {
  const i = I(); if (!i || i.end) return;
  snap();
  const bt = i.bats[i.st], bw = i.bwl[i.cb];
  const wasFH = i.fh;
  let legal = true, label;
  if (mode === "wd") {
    legal = false; i.runs += 1 + n; i.ext += 1 + n; bw.r += 1 + n; label = "Wd" + (n ? "+" + n : "");
    // a wide keeps a free hit going
  } else if (mode === "nb" && nbBye) {
    // No ball, not off the bat: the runs are byes, not the bowler's.
    legal = false; i.runs += 1 + n; i.ext += 1 + n; bw.r += 1; bt.b += 1;
    label = "Nb+" + n + "b"; i.fh = true;
  } else if (mode === "nb") {
    legal = false; i.runs += 1 + n; i.ext += 1; bw.r += 1 + n; bt.r += n; bt.b += 1;
    if (n === 4) bt.f++; if (n === 6) bt.s++;
    label = "Nb" + (n ? "+" + n : ""); i.fh = true;
  } else if (mode === "b" || mode === "lb") {
    i.runs += n; i.ext += n; bt.b += 1; label = n + mode; i.fh = false;
  } else {
    i.runs += n; bt.r += n; bt.b += 1; bw.r += n; if (n === 4) bt.f++; if (n === 6) bt.s++;
    label = n === 0 ? "•" : String(n); i.fh = false;
  }
  if (legal) { i.balls++; bw.b++; }
  i.over.push(label);
  if (n % 2 === 1) swap(i);
  S.fx = null;
  if ((mode === null || (mode === "nb" && !nbBye)) && (n === 4 || n === 6)) fx(n === 4 ? "FOUR" : "SIX");
  else if (mode === "nb") fx("FREE");
  mode = null; nbBye = false;
  afterBall(legal);
}

async function wicket() {
  const i = I(); if (!i || i.end) return;
  // On a no ball or a free hit only a run out counts; on a wide also stumped / hit wicket.
  let kinds = ["Bowled", "Caught", "LBW", "Run out", "Stumped", "Hit wicket"];
  let note = "";
  if (mode === "nb") { kinds = ["Run out"]; note = " (No ball par sirf run out)"; }
  else if (i.fh) { kinds = ["Run out"]; note = " (FREE HIT: sirf run out)"; }
  else if (mode === "wd") { kinds = ["Stumped", "Run out", "Hit wicket"]; note = " (Wide par)"; }
  const k = await askChoice("Kaise out hua?" + note, kinds, true);
  if (k == null) return;
  const how = kinds[k];
  let outIdx = i.st, ranRuns = 0;
  if (how === "Run out") {
    const who = await askChoice("Kaun run out hua?", [i.bats[i.st].n + " (striker)", i.bats[i.ns].n + " (non-striker)"], true);
    if (who == null) return;
    outIdx = who === 0 ? i.st : i.ns;
    const rr = await askChoice("Out hone se pehle kitne run bane?", ["0", "1", "2", "3"], true);
    if (rr == null) return;
    ranRuns = rr;
  }
  snap();
  const bt = i.bats[i.st], bw = i.bwl[i.cb];
  const wasNb = mode === "nb", wasWd = mode === "wd";
  let legal = !(wasNb || wasWd);
  if (wasWd) { i.runs += 1; i.ext += 1; bw.r += 1; }
  if (wasNb) { i.runs += 1; i.ext += 1; bw.r += 1; }
  if (!wasWd) bt.b += 1;
  i.runs += ranRuns; if (!wasWd) bt.r += ranRuns; else i.ext += ranRuns; bw.r += ranRuns;
  if (legal) { i.balls++; bw.b++; }
  const out = i.bats[outIdx];
  out.out = how;
  i.wk++;
  if (how !== "Run out") bw.w++;
  i.over.push("W");
  if (!wasNb) i.fh = false;
  mode = null; nbBye = false;
  // Who ends up where after the runs they ran.
  if (ranRuns % 2 === 1) swap(i);
  const outAtStrike = i.st === outIdx;
  S.fx = null; fx("WICKET");
  const allOut = i.wk >= S.wl;
  if (!allOut && !(legal && i.balls >= S.overs * 6) && !chased()) {
    push(); render();
    const nm = await askName("Naya batsman (" + out.n + " out)");
    i.bats.push(newBat(nm));
    const idx = i.bats.length - 1;
    if (outAtStrike) i.st = idx; else i.ns = idx;
  } else {
    // Nobody comes in; keep the not-out one showing.
    if (outAtStrike) i.st = i.ns;
    i.ns = null;
  }
  afterBall(legal);
}

function chased() { return S.cur === 1 && I().runs >= target(); }

async function afterBall(legal) {
  const i = I();
  const overDone = legal && i.balls % 6 === 0 && i.balls > 0;
  if (overDone) { i.last = i.over; i.over = []; swap(i); }
  if (i.wk >= S.wl || i.balls >= S.overs * 6 || chased()) {
    i.end = true;
    if (i.ns === null || i.ns === undefined) { /* already handled */ }
    if (S.cur === 1) finish();
    push(); render(); return;
  }
  push(); render();
  if (overDone) await changeBowler(false);
}

function finish() {
  const a = S.inn[0], b = S.inn[1];
  if (b.runs >= target()) { const w = S.wl - b.wk; S.result = b.bat + " won by " + w + " wicket" + (w === 1 ? "" : "s"); }
  else if (b.runs === a.runs) S.result = "Match tied";
  else { const d = a.runs - b.runs; S.result = a.bat + " won by " + d + " run" + (d === 1 ? "" : "s"); }
}

async function changeBowler(cancel) {
  const i = I();
  const cur = i.bwl[i.cb] ? i.bwl[i.cb].n : null;
  const choices = i.bwl.map((b) => b.n).filter((n) => n !== cur);
  const nm = await askName(cancel ? "Bowler badlein" : "Over khatam. Agla bowler kaun?", { choices: choices, cancel: cancel });
  if (!nm) return;
  if (cancel) snap();
  let k = i.bwl.findIndex((b) => b.n.toLowerCase() === nm.toLowerCase());
  if (k < 0) { i.bwl.push({ n: nm, b: 0, r: 0, w: 0 }); k = i.bwl.length - 1; }
  i.cb = k;
  push(); render();
}

function undo() {
  if (!H.length) return alert("Undo ke liye kuch nahi.");
  S = JSON.parse(H.pop());
  S.fx = null; mode = null; nbBye = false;
  push(); render();
}

async function setMsg() {
  const pre = ["", "Drinks break", "Strategic time-out", "Rain delay", "Innings break", "Man of the Match: "];
  sheet('<h3>Screen par message</h3><div class="note">Scoreboard ke upar peeli patti mein dikhega. Khali chhorein to hat jayega.</div>' +
    '<div class="chips" id="ch">' + pre.slice(1).map((p, k) => '<button data-k="' + (k + 1) + '">' + esc(p) + "</button>").join("") + "</div>" +
    '<input id="nm" value="' + esc(S.msg) + '" placeholder="Message">' +
    '<button class="btn gold" id="ok">Dikhayein</button><button class="btn light" id="clr">Hata dein</button>', () => {
    $("ch").onclick = (e) => { const k = e.target.getAttribute("data-k"); if (k != null) { $("nm").value = pre[+k]; $("nm").focus(); } };
    $("ok").onclick = () => { S.msg = $("nm").value.trim(); closeSheet(); push(); render(); };
    $("clr").onclick = () => { S.msg = ""; closeSheet(); push(); render(); };
  });
}

async function renameSomeone() {
  const i = I();
  const list = [["Team 1: " + S.t1, "t1"], ["Team 2: " + S.t2, "t2"]];
  i.bats.forEach((b, k) => { if (!b.out && (k === i.st || k === i.ns)) list.push(["Batsman: " + b.n, "bat" + k]); });
  i.bwl.forEach((b, k) => list.push(["Bowler: " + b.n, "bwl" + k]));
  const k = await askChoice("Kis ka naam theek karna hai?", list.map((x) => x[0]), true);
  if (k == null) return;
  const key = list[k][1];
  const nm = await askName("Naya naam", { cancel: true });
  if (!nm) return;
  snap();
  if (key === "t1" || key === "t2") {
    const old = S[key]; S[key] = nm;
    S.inn.forEach((x) => { if (x.bat === old) x.bat = nm; if (x.bowl === old) x.bowl = nm; });
  } else if (key.startsWith("bat")) i.bats[+key.slice(3)].n = nm;
  else i.bwl[+key.slice(3)].n = nm;
  push(); render();
}

function newMatch() {
  if (!confirm("Naya match? Purana score mit jayega (link wohi rahega).")) return;
  S = fresh(S); H = []; mode = null; push(); render();
}

/* ---------- overlay link ---------- */
function overlayUrl() { return location.href.replace(/[^/]*(\?.*)?(#.*)?$/, "") + "overlay.html?t=" + S.code; }
function linkCard() {
  return '<div class="card"><h2>Camera wale phone ka link</h2>' +
    '<div class="link">' + esc(cameraUrl()) + "</div>" +
    '<button class="btn gold" id="copyc">Camera link copy</button>' +
    '<div class="note">Ye link camera wale phone par Chrome mein kholein: camera + scoreboard ek saath. Phir Streamlabs ke Screen share se live jayein.</div></div>' +
    '<div class="card"><h2>Sirf scoreboard ka link (overlay)</h2>' +
    '<div class="link" id="ourl">' + esc(overlayUrl()) + "</div>" +
    '<div class="row"><button class="btn light" id="copy">Link copy</button><button class="btn light" id="prev">Preview</button></div>' +
    '<iframe class="preview hide" id="pf"></iframe>' +
    '<div class="note">Green dot = score live ja raha hai. Red = internet check karein (score phone mein save hai, internet aate hi chala jayega).</div></div>';
}
function cameraUrl() { return overlayUrl().replace("overlay.html", "camera.html"); }
async function copyText(btn, text) {
  try { await navigator.clipboard.writeText(text); btn.textContent = "Copy ho gaya"; }
  catch (e) { prompt("Ye link copy karein:", text); }
}
function wireLink() {
  $("copy").onclick = () => copyText($("copy"), overlayUrl());
  $("copyc").onclick = () => copyText($("copyc"), cameraUrl());
  $("prev").onclick = () => { const f = $("pf"); if (f.classList.contains("hide")) { f.src = overlayUrl() + "&bg=1"; f.classList.remove("hide"); } else { f.classList.add("hide"); f.src = "about:blank"; } };
}

$("menuBtn").onclick = () => {
  sheet('<h3>Settings</h3>' +
    '<label>Kitne over</label><input id="sov" inputmode="numeric" value="' + S.overs + '">' +
    '<label>Kitni wickets (all out)</label><input id="swl" inputmode="numeric" value="' + S.wl + '">' +
    '<label>"LIVE" ka nishan</label><div class="seg2"><button id="lv1" class="' + (S.live ? "on" : "") + '">Dikhayein</button><button id="lv0" class="' + (S.live ? "" : "on") + '">Chhupayein</button></div>' +
    '<button class="btn gold" id="ok">Save</button><button class="btn red" id="nm2">Naya match</button><button class="btn light" id="cx">Band karein</button>', () => {
    let live = S.live;
    $("lv1").onclick = () => { live = true; $("lv1").className = "on"; $("lv0").className = ""; };
    $("lv0").onclick = () => { live = false; $("lv0").className = "on"; $("lv1").className = ""; };
    $("ok").onclick = () => {
      const ov = parseInt($("sov").value, 10), wl = parseInt($("swl").value, 10);
      if (!(ov > 0 && ov <= 100) || !(wl > 0 && wl <= 20)) return alert("Over/wickets sahi likhein.");
      snap(); S.overs = ov; S.wl = wl; S.live = live; closeSheet(); push(); render();
    };
    $("nm2").onclick = () => { closeSheet(); if (S.stage === "setup") return; newMatch(); };
    $("cx").onclick = closeSheet;
  });
};

render();
push();
// Keep the overlay fresh even if a message was missed.
setInterval(() => pub.publish(view()), 20000);
</script>
</body>
